<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DELIVO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --surface:#12151C;
    --surface-2:#181D27;
    --surface-3:#1F2530;
    --border:#262C38;
    --text:#F1F0EC;
    --text-dim:#9AA1AF;
    --text-faint:#5C6270;
    --accent:#FF5A2B;
    --accent-dim:#432416;
    --teal:#00C2A0;
    --teal-dim:#0C2A26;
    --amber:#FFB020;
    --amber-dim:#332508;
    --danger:#FF4D5E;
    --danger-dim:#3A1219;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#050608;color:var(--text);font-family:'Manrope',sans-serif;}
  body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:18px 0;}
  h1,h2,h3,.display{font-family:'Unbounded',sans-serif;}
  button{font-family:inherit;}
  .phone{
    width:390px;max-width:100vw;min-height:800px;background:var(--bg);
    border-radius:34px;border:1px solid #1B1F27;overflow:hidden;position:relative;
    box-shadow:0 0 0 6px #050608, 0 30px 60px rgba(0,0,0,.5);
    display:flex;flex-direction:column;
  }
  .screen{flex:1;display:flex;flex-direction:column;min-height:800px;position:relative;}
  .scroll{flex:1;overflow-y:auto;padding:18px 18px 100px;}
  .scroll::-webkit-scrollbar{width:0}
  /* ---- generic bits ---- */
  .eyebrow{color:var(--text-faint);font-size:12.5px;letter-spacing:.02em;margin-bottom:6px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    border-radius:999px;padding:15px 20px;font-weight:700;font-size:15px;transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#140700;width:100%;}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
  .btn-ghost{background:var(--surface-2);color:var(--text);width:100%;border:1px solid var(--border);}
  .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);width:100%;}
  .btn-danger{background:var(--danger-dim);color:var(--danger);width:100%;}
  .btn-sm{padding:9px 14px;font-size:13px;border-radius:999px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;}
  .card + .card{margin-top:12px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px;}
  .field input, .field textarea, .field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 14px;color:var(--text);font-size:15px;font-family:inherit;
  }
  .field textarea{resize:none;min-height:64px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;}
  .chip-dot{width:7px;height:7px;border-radius:50%;}
  .muted{color:var(--text-dim);}
  .faint{color:var(--text-faint);}
  .divider{height:1px;background:var(--border);margin:14px 0;}
  .stack-sm > * + *{margin-top:8px;}
  .stack > * + *{margin-top:14px;}
  a.link{color:var(--accent);text-decoration:none;font-weight:700;}
  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;}
  .brandmark{display:flex;align-items:center;gap:9px;}
  .brandmark .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Unbounded';font-weight:700;color:#140700;font-size:14px;}
  .role-pill{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    padding:7px 12px 7px 8px;border-radius:999px;cursor:pointer;}
  .role-pill .av{width:22px;height:22px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:12px;}
  .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:16px;}
  .badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#140700;font-size:10px;font-weight:800;
    min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  /* bottom nav */
  .bottomnav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(18,21,28,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);padding:10px 6px 14px;}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--text-faint);font-size:10.5px;font-weight:700;}
  .navitem.active{color:var(--accent);}
  .navitem .ico{font-size:19px;}
  /* sheet / modal */
  .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:40;}
  .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px 26px;max-height:82%;overflow-y:auto;
    border:1px solid var(--border);border-bottom:none;animation:sheetup .22s ease;}
  @keyframes sheetup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 16px;}
  /* onboarding */
  .center-flow{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;text-align:center;}
  .splash-logo{width:84px;height:84px;border-radius:24px;background:var(--accent);margin:0 auto 22px;display:flex;
    align-items:center;justify-content:center;font-family:'Unbounded';font-weight:800;font-size:34px;color:#140700;
    animation:pop .9s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
  .role-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--border);
    border-radius:var(--radius-lg);padding:17px;cursor:pointer;text-align:left;}
  .role-card:active{transform:scale(.98);}
  .role-card.sel{border-color:var(--accent);background:linear-gradient(180deg, rgba(255,90,43,.09), rgba(255,90,43,.02));}
  .role-card .emoji{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .otp-boxes{display:flex;gap:9px;justify-content:center;margin:22px 0 8px;}
  .otp-boxes input{width:44px;height:56px;text-align:center;font-size:22px;font-weight:800;background:var(--surface-2);
    border:1px solid var(--border);border-radius:12px;color:var(--text);}
  /* map */
  .mapbox{background:radial-gradient(circle at 30% 20%, #101821 0%, #0B0E13 70%);border:1px solid var(--border);
    border-radius:var(--radius-lg);position:relative;overflow:hidden;}
  .mapbox svg{display:block;width:100%;height:100%;}
  .map-pin-label{font-family:'Manrope';font-weight:700;fill:var(--text);font-size:10px;}
  /* status chips colors set inline via class */
  .st-created,.st-searching{background:var(--amber-dim);color:var(--amber);}
  .st-progress{background:var(--teal-dim);color:var(--teal);}
  .st-done{background:var(--teal-dim);color:var(--teal);}
  .st-cancel{background:var(--danger-dim);color:var(--danger);}
  /* offer card */
  .offer-card{border:1.5px solid var(--accent);border-radius:var(--radius-lg);padding:16px;background:linear-gradient(180deg, rgba(255,90,43,.10), rgba(255,90,43,.02));}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,43,.5)}70%{box-shadow:0 0 0 8px rgba(255,90,43,0)}100%{box-shadow:0 0 0 0 rgba(255,90,43,0)}}
  /* chat */
  .msg{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;margin-bottom:8px;}
  .msg.me{background:var(--accent);color:#140700;margin-left:auto;border-bottom-right-radius:4px;font-weight:600;}
  .msg.them{background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.sys{background:transparent;color:var(--text-faint);text-align:center;margin:8px auto;font-size:12px;max-width:100%;}
  /* code display */
  .code-display{letter-spacing:10px;font-family:'Unbounded';font-size:30px;font-weight:700;text-align:center;padding:16px;
    background:var(--surface-2);border:1.5px dashed var(--border);border-radius:16px;color:var(--accent);}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;}
  .kv .k{color:var(--text-dim);}
  table.admtable{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.admtable th{text-align:left;color:var(--text-faint);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--border);font-size:11px;}
  table.admtable td{padding:9px 4px;border-bottom:1px solid var(--border);}
  .segtabs{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;}
  .segtabs .seg{flex:1;text-align:center;padding:8px 6px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--text-dim);cursor:pointer;}
  .segtabs .seg.active{background:var(--surface-3);color:var(--text);}
  .toast{position:absolute;top:70px;left:18px;right:18px;background:var(--surface-3);border:1px solid var(--border);
    border-radius:14px;padding:12px 14px;font-size:13.5px;z-index:60;box-shadow:0 12px 24px rgba(0,0,0,.4);animation:toastin .25s ease;}
  @keyframes toastin{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
  .empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
  .empty .em{font-size:34px;margin-bottom:10px;}
</style>

<script>
/* =========================================================
   DELIVO — прототип полного сценария (front-end симуляция)
   Один HTML-файл. Роли переключаются вручную (демо-режим),
   т.к. реального backend/Telegram/WebSocket здесь нет —
   вся "серверная" логика (state machine, dispatch, коды)
   выполняется тут же, в памяти браузера.
   ========================================================= */

let SEQ = 1;
const uid = () => 'id' + (SEQ++);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pubId = (prefix) => prefix + '-' + Array.from({length:6},()=> "ABCDEFGHJKMNPQRSTUVWXYZ23456789"[rnd(0,30)]).join('');
const code4 = () => String(rnd(1000,9999));
const esc = (s='') => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowStr = () => { const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); };

const TRANSPORT = {
  WALK:{icon:'🚶', label:'Пешком', speed:5},
  BIKE:{icon:'🚲', label:'Велосипед', speed:15},
  MOTO:{icon:'🛵', label:'Мотоцикл', speed:34},
  CAR:{icon:'🚗', label:'Автомобиль', speed:28},
};

const STATUS_META = {
  CREATED:{label:'Создан', cls:'st-created', icon:'🆕'},
  SEARCHING_COURIER:{label:'Ищем курьера', cls:'st-searching', icon:'🔎'},
  COURIER_ASSIGNED:{label:'Курьер назначен', cls:'st-progress', icon:'🛵'},
  COURIER_GOING_TO_PICKUP:{label:'Курьер едет за товаром', cls:'st-progress', icon:'🚚'},
  COURIER_ARRIVED_PICKUP:{label:'Курьер на месте', cls:'st-progress', icon:'📍'},
  PICKED_UP:{label:'Товар получен курьером', cls:'st-progress', icon:'📦'},
  IN_TRANSIT:{label:'В пути', cls:'st-progress', icon:'🚚'},
  COURIER_NEAR_DESTINATION:{label:'Курьер почти на месте', cls:'st-progress', icon:'📍'},
  DELIVERED:{label:'Доставлено', cls:'st-done', icon:'✅'},
  CANCELLED:{label:'Отменён', cls:'st-cancel', icon:'✕'},
  EXPIRED:{label:'Курьер не найден', cls:'st-cancel', icon:'⏱'},
};

/* ---------------- в памяти "база данных" ---------------- */
const DB = {
  users:{}, shops:{}, couriers:{}, customers:{}, addresses:{}, orders:{}, messages:{}, ratings:{}, notifications:[]
};

function seedWorld(){
  // Продавец / магазин
  const sellerId = uid();
  DB.users[sellerId] = {id:sellerId, publicId:pubId('USR'), phone:'+7 900 111-22-33', name:'Ахмед Валиев', role:'SELLER'};
  const shopId = uid();
  DB.shops[shopId] = {id:shopId, publicId:pubId('SHP'), ownerId:sellerId, name:'HORIZON MARKET',
    address:'ул. Гагарина, 14', x:64, y:150, status:'ACTIVE'};
  DB.users[sellerId].shopId = shopId;

  // Покупатель
  const custId = uid();
  DB.users[custId] = {id:custId, publicId:pubId('USR'), phone:'+7 900 222-33-44', name:'Амина Расулова', role:'CUSTOMER'};
  DB.customers[custId] = {id:custId};
  DB.addresses[custId] = [
    {id:uid(), label:'Дом', address:'пр. Рудаки, 55, кв. 12', x:262, y:56, comment:'Домофон 12К', isDefault:true},
    {id:uid(), label:'Работа', address:'ул. Бехзода, 3, офис 401', x:230, y:172, comment:''},
  ];

  // Курьеры
  const couriersSeed = [
    {name:'Фаррух Назаров', transport:'MOTO', x:118, y:126, rating:4.9, acc:.95, comp:.98, status:'APPROVED'},
    {name:'Шерали Комилов', transport:'BIKE', x:186, y:36,  rating:4.6, acc:.88, comp:.90, status:'APPROVED'},
    {name:'Далер Юсупов',   transport:'CAR',  x:36,  y:34,  rating:4.8, acc:.90, comp:.95, status:'PENDING'},
  ];
  couriersSeed.forEach(c=>{
    const id = uid();
    DB.users[id] = {id, publicId:pubId('USR'), phone:'+7 900 '+rnd(300,999)+'-00-'+rnd(10,99), name:c.name, role:'COURIER'};
    const maxActive = c.transport==='WALK'?1:c.transport==='BIKE'?2:c.transport==='MOTO'?2:3;
    DB.couriers[id] = {id, publicId:pubId('DRV'), transport:c.transport, rating:c.rating, ratingCount:12,
      acceptanceRate:c.acc, completionRate:c.comp, x:c.x, y:c.y, status:c.status, online:c.status==='APPROVED',
      available:true, activeDeliveries:0, maxActive, city:'Центральный район', zone:'Зона 1'};
  });

  DB.shopId = shopId;
  DB.customerId = custId;
}
seedWorld();

/* ---------------- состояние приложения ---------------- */
const S = {
  screen:'splash',            // splash, welcome, roleSelect, phone, otp, profile, app
  onboard:{ role:null, name:'', phone:'+992 ', password:'', otpResend:45, sessionId:null, confirmed:false },
  activeRole:null,            // SELLER | COURIER | CUSTOMER | ADMIN
  tabs:{ SELLER:'home', COURIER:'home', CUSTOMER:'home', ADMIN:'dash' },
  sheet:null,                 // roleSwitcher | notifications | newOrder | orderDetail | chat | rating | newAddress
  toast:null,
  newOrder:{ step:0, phone:'', foundCustomerId:null, item:{name:'',qty:1,price:'',weight:'',comment:''}, addressId:null },
  currentOrderId:null,
  chatText:'',
  ratingDraft:{stars:5, comment:''},
  filters:{ customerHistory:'ALL', adminOrders:'ALL' },
};

function notify(recipientRole, recipientId, channel, title, body, orderId){
  DB.notifications.unshift({id:uid(), recipientRole, recipientId, channel, title, body, orderId, time:nowStr(), read:false});
}
function toast(text){ S.toast = text; render(); setTimeout(()=>{ if(S.toast===text){S.toast=null; render();} }, 2600); }

/* ---------------- геометрия / dispatch ---------------- */
function pxDist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function kmFromPx(px){ return Math.max(0.3, +(px/34).toFixed(1)); }
function etaMin(km, transportKey){ const sp = TRANSPORT[transportKey].speed; return Math.max(3, Math.round(km/sp*60)+3); }

function availableCouriers(){
  return Object.values(DB.couriers).filter(c=> c.status==='APPROVED' && c.online && c.available && c.activeDeliveries < c.maxActive);
}

function scoreCourier(courier, shop, addr){
  const dPickup = kmFromPx(pxDist(courier, shop));
  const dDrop = kmFromPx(pxDist(shop, addr));
  const totalKm = dPickup + dDrop;
  const eta = etaMin(totalKm, courier.transport);
  const proximity = Math.max(0, 100 - dPickup*14);
  const etaScore = Math.max(0, 100 - eta*2);
  const ratingScore = courier.rating*20;
  const accScore = courier.acceptanceRate*100;
  const compScore = courier.completionRate*100;
  const workloadScore = ((courier.maxActive - courier.activeDeliveries)/courier.maxActive)*100;
  const score = proximity*.40 + etaScore*.20 + ratingScore*.15 + accScore*.10 + compScore*.10 + workloadScore*.05;
  return {score:Math.round(score), dPickup, dDrop, eta};
}

function startDispatch(order){
  const shop = DB.shops[DB.shopId];
  const addr = DB.addresses[order.customerId].find(a=>a.id===order.addressId);
  const ranked = availableCouriers().map(c=>{
    const s = scoreCourier(c, shop, addr);
    return {courierId:c.id, ...s};
  }).sort((a,b)=> b.score-a.score);

  order.dispatch = {
    ranked,
    wave:1,
    waveGroups: ranked.length>1 ? [ranked.slice(0, Math.ceil(ranked.length/2)), ranked.slice(Math.ceil(ranked.length/2))] : [ranked],
    deadline: Date.now()+15000,
    offers:{}, // courierId -> PENDING/SKIPPED/EXPIRED
  };
  sendWave(order);
}
function sendWave(order){
  const group = order.dispatch.waveGroups[order.dispatch.wave-1] || [];
  group.forEach(r=>{
    order.dispatch.offers[r.courierId] = 'PENDING';
    const c = DB.couriers[r.courierId];
    notify('COURIER', r.courierId, 'TELEGRAM', '🚨 Новый заказ',
      `Заказ ${order.publicId} · Забрать ${r.dPickup} км · Доставить ${r.dDrop} км · Доход ${order.deliveryFee} ₽`, order.id);
  });
  order.dispatch.deadline = Date.now()+15000;
}
function tickDispatch(order){
  if(order.status!=='SEARCHING_COURIER' || !order.dispatch) return;
  if(Date.now() < order.dispatch.deadline) return;
  // истёк таймер текущей волны
  const group = order.dispatch.waveGroups[order.dispatch.wave-1] || [];
  group.forEach(r=>{ if(order.dispatch.offers[r.courierId]==='PENDING') order.dispatch.offers[r.courierId]='EXPIRED'; });
  if(order.dispatch.wave < order.dispatch.waveGroups.length){
    order.dispatch.wave++;
    sendWave(order);
  } else {
    order.status = 'EXPIRED';
    notify('SELLER', DB.shops[DB.shopId].ownerId, 'PUSH', 'Курьер не найден', `Заказ ${order.publicId}: свободных курьеров нет. Попробуйте ещё раз.`, order.id);
  }
}

function acceptOffer(orderId, courierId){
  const order = DB.orders[orderId];
  if(order.status!=='SEARCHING_COURIER'){ toast('Заказ уже принят другим курьером'); return; }
  const courier = DB.couriers[courierId];
  order.status='COURIER_ASSIGNED';
  order.courierId = courierId;

/* ---- интеграция с ботом-курьером через Firebase RTDB ----
   Cloud Function на бэкенде слушает /liveOrders/{id}, рассылает
   заказ всем зарегистрированным курьерам-ботам с кнопкой "Принять",
   и пишет сюда courierChatId, когда кто-то из них нажал кнопку. */
function broadcastOrderToTelegramCouriers(order, shop){
  const addr = DB.addresses[order.customerId]?.find(a=>a.id===order.addressId);
  rtdb.ref('liveOrders/'+order.id).set({
    publicId: order.publicId,
    shopName: shop.name,
    itemName: order.items[0]?.name || '',
    addressLabel: addr ? addr.label : '',
    total: order.total,
    createdAt: Date.now(),
  });
  rtdb.ref('liveOrders/'+order.id).on('value', snap=>{
    const v = snap.val();
    if(v && v.courierChatId && !order.courierId){
      const courierId = 'tg_'+v.courierChatId;
      if(!DB.users[courierId]){
        DB.users[courierId] = {id:courierId, publicId:pubId('USR'), phone:'', name:v.courierName||'Курьер (Telegram)', role:'COURIER'};
        DB.couriers[courierId] = {id:courierId, status:'APPROVED', online:true, available:false, activeDeliveries:1, maxActive:1, rating:5, ratingCount:0, x:0, y:0};
      }
      order.courierId = courierId;
      order.status = 'COURIER_ASSIGNED';
      notify('SELLER', order.sellerId, 'PUSH', 'Курьер найден', `${DB.users[courierId].name} принял заказ в Telegram`, order.id);
      if(S.currentOrderId===order.id) render();
    }
  });
}

function courierAdvance(order){
  const c = DB.couriers[order.courierId];
  if(order.status==='COURIER_ASSIGNED'){
    order.status='COURIER_GOING_TO_PICKUP'; order.trackProgress=0;
  } else if(order.status==='COURIER_ARRIVED_PICKUP'){
    // handled via code confirm on seller side
  } else if(order.status==='PICKED_UP'){
    order.status='IN_TRANSIT'; order.trackProgress=0;
    notify('CUSTOMER', order.customerId, 'PUSH', 'Заказ в пути', `Курьер забрал товар и едет к вам. Код получения: ${order.deliveryCode}`, order.id);
  }
  render();
}
function courierArrived(order){
  if(order.status==='COURIER_GOING_TO_PICKUP'){
    order.status='COURIER_ARRIVED_PICKUP';
    notify('SELLER', DB.shops[DB.shopId].ownerId, 'PUSH', 'Курьер приехал', `${DB.users[order.courierId].name} ждёт у магазина.`, order.id);
  } else if(order.status==='IN_TRANSIT' || order.status==='COURIER_NEAR_DESTINATION'){
    order.status='COURIER_ARRIVED_DESTINATION_WAIT'; // внутр. флаг ожидания кода
    notify('CUSTOMER', order.customerId, 'PUSH', 'Курьер на месте', `Назовите курьеру код: ${order.deliveryCode}`, order.id);
  }
  render();
}
function confirmPickupCode(order, entered){
  if(entered===order.pickupCode){
    order.status='PICKED_UP';
    notify('COURIER', order.courierId, 'PUSH', 'Код верный', 'Можно ехать к покупателю.', order.id);
    toast('Код подтверждён — товар передан курьеру');
  } else { toast('Неверный код'); }
  render();
}
function confirmDeliveryCode(order, entered){
  if(entered===order.deliveryCode){
    order.status='DELIVERED';
    const c = DB.couriers[order.courierId]; c.activeDeliveries = Math.max(0,c.activeDeliveries-1); c.completionRate = Math.min(1, c.completionRate+0.002);
    notify('SELLER', DB.shops[DB.shopId].ownerId, 'TELEGRAM', '✅ Доставка завершена', `Заказ ${order.publicId} доставлен.`, order.id);
    notify('CUSTOMER', order.customerId, 'PUSH', '✅ Доставка завершена', 'Спасибо! Оцените, пожалуйста, доставку.', order.id);
    toast('Доставка завершена');
  } else { toast('Неверный код'); }
  render();
}
function cancelOrder(order, byRole){
  order.status='CANCELLED';
  if(order.courierId){ const c=DB.couriers[order.courierId]; c.activeDeliveries=Math.max(0,c.activeDeliveries-1); }
  DB.messages[order.id] = DB.messages[order.id] || [];
  DB.messages[order.id].push({id:uid(), sys:true, text:`Заказ отменён (${byRole==='SELLER'?'продавцом':'покупателем'})`, time:nowStr()});
  render();
}
function submitRating(order){
  DB.ratings[order.id] = {...S.ratingDraft, orderId:order.id};
  if(order.courierId){
    const c = DB.couriers[order.courierId];
    c.rating = +(((c.rating*c.ratingCount)+S.ratingDraft.stars)/(c.ratingCount+1)).toFixed(2);
    c.ratingCount++;
  }
  S.sheet=null; toast('Спасибо за оценку!'); render();
}

/* ---------------- глобальный тикер ---------------- */
setInterval(()=>{
  let dirty=false;
  Object.values(DB.orders).forEach(o=>{
    if(o.status==='SEARCHING_COURIER'){ tickDispatch(o); dirty=true; }
    if(o.status==='COURIER_GOING_TO_PICKUP' && o.trackProgress<1){ o.trackProgress=Math.min(1,o.trackProgress+1/14); dirty=true; }
    if(o.status==='IN_TRANSIT' && o.trackProgress<1){
      o.trackProgress=Math.min(1,o.trackProgress+1/18);
      if(o.trackProgress>=0.8 && o.status==='IN_TRANSIT'){ o.status='COURIER_NEAR_DESTINATION'; notify('CUSTOMER', o.customerId,'PUSH','Курьер почти рядом','Ваш заказ будет через пару минут.', o.id); }
      dirty=true;
    }
    if(o.status==='COURIER_NEAR_DESTINATION' && o.trackProgress<1){ o.trackProgress=Math.min(1,o.trackProgress+1/6); dirty=true; }
  });
  if(dirty && S.screen==='app') render();
}, 1000);

function startPhoneVerification(){

  rtdb.ref('verifications/'+S.onboard.sessionId).set({

/* Firebase Auth требует email — превращаем номер телефона в
   псевдо-email вида "992901234567@delivo.app". Сам номер как логин
   и пароль пользователя проверяет сервер Firebase, а не JS в браузере. */
function phoneToEmail(phone){
  const digits = phone.replace(/\D/g,'');
  return digits + '@delivo.app';
}
function listenForPhoneConfirmation(sessionId){
  rtdb.ref('verifications/'+sessionId).on('value', snap=>{
    const v = snap.val();
    if(v && v.status==='confirmed' && S.onboard.sessionId===sessionId && S.screen==='otp'){
      S.onboard.confirmed = true;
      finalizeRegistration();
    }
  });
}
async function finalizeRegistration(){
  try{
    const email = phoneToEmail(S.onboard.phone);
    const cred = await auth.createUserWithEmailAndPassword(email, S.onboard.password);
    await rtdb.ref('users/'+cred.user.uid).set({
      name: S.onboard.name,
      phone: S.onboard.phone,
      role: S.onboard.role,
      createdAt: Date.now(),
    });
  }catch(err){
    // если аккаунт с таким номером уже существует и т.п. — не блокируем демо-показ профиля
    console.warn('Firebase Auth:', err.message);
  }
  S.screen='profile'; render();
}
function tickResend(){
  if(S.screen!=='otp') return;
  if(S.onboard.otpResend>0){ S.onboard.otpResend--; setTimeout(tickResend,1000); const el=document.getElementById('resendTimer'); if(el) el.textContent = S.onboard.otpResend; }

/* ---------------- mini SVG map ---------------- */
function miniMapSVG(points, opts={}){
  const w=320,h= opts.h||150;
  let path='';
  if(opts.route){
    path = `<path d="M${opts.route[0].x},${opts.route[0].y} Q ${(opts.route[0].x+opts.route[1].x)/2},${Math.min(opts.route[0].y,opts.route[1].y)-30} ${opts.route[1].x},${opts.route[1].y}" fill="none" stroke="#262C38" stroke-width="2" stroke-dasharray="5,6"/>`;
  }
  const dots = Array.from({length:26},(_,i)=>`<circle cx="${(i%7)*48+14}" cy="${Math.floor(i/7)*46+16}" r="1.2" fill="#1B2029"/>`).join('');
  const markers = points.map(p=>`
    <g transform="translate(${p.x},${p.y})">
      ${p.pulse? `<circle r="13" fill="#FF5A2B" opacity=".18"><animate attributeName="r" values="10;18;10" dur="1.6s" repeatCount="indefinite"/></circle>`:''}
      <circle r="13" fill="#181D27" stroke="${p.stroke||'#262C38'}" stroke-width="1.5"/>
      <text text-anchor="middle" dy="5" font-size="13">${p.icon}</text>
      ${p.tag? `<text class="map-pin-label" text-anchor="middle" y="26">${esc(p.tag)}</text>`:''}
    </g>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${dots}${path}${markers}</svg>`;
}

/* ---------------- секретная панель (5 тапов по лого) ----------------
   Вход — настоящий Firebase Auth (email+пароль), а не строка в JS:
   проверку делает сервер Firebase, а не браузер, поэтому подделать
   её через "Просмотр кода страницы" нельзя.
   Токены ботов НИКОГДА не пишутся в Realtime Database и не хранятся
   на клиенте — форма отправляет их напрямую в защищённую Cloud
   Function updateBotToken, которая кладёт их в Secret Manager.
   Настройка первого админ-аккаунта — в SETUP.md. */
let logoTapCount = 0, logoTapTimer = null;
function tapLogo(){
  logoTapCount++;
  clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(()=>{ logoTapCount = 0; }, 2500);
  if(logoTapCount>=5){
    logoTapCount = 0;
    S.sheet = 'secretSettings';
    render();
  }
}
function secretSignIn(){
  const email = document.getElementById('secretEmail').value.trim();
  const pass = document.getElementById('secretPassInput').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(()=> render())
    .catch(err=> toast('Не удалось войти: '+err.message));
}
function secretSignOut(){ auth.signOut().then(render); }
async function saveSecretUsernames(){
  const verifyUsername = document.getElementById('cfgVerifyBot').value.trim().replace(/^@/,'');
  const mainUsername = document.getElementById('cfgMainBot').value.trim().replace(/^@/,'');
  await rtdb.ref('config/public').update({
    verifyBotUsername: verifyUsername || APP_CONFIG.verifyBotUsername,
    mainBotUsername: mainUsername || APP_CONFIG.mainBotUsername,
  });
  toast('Username-ы сохранены');
}
async function saveSecretToken(botKey, inputId, statusId){
  const token = document.getElementById(inputId).value.trim();
  const statusEl = document.getElementById(statusId);
  if(!token){ toast('Введите токен'); return; }
  if(statusEl) statusEl.textContent = 'Сохраняю…';
  try{
    const updateBotToken = cloudFns.httpsCallable('updateBotToken');
    await updateBotToken({ botKey, token });
    document.getElementById(inputId).value = '';
    if(statusEl) statusEl.textContent = '✅ Токен обновлён';
    toast('Токен сохранён на сервере');
  }catch(err){
    if(statusEl) statusEl.textContent = '';
    toast('Ошибка: '+err.message);
  }
}

function orderDetailHTML(){
  const o = DB.orders[S.currentOrderId];
  if(!o) return '';
  const meta = STATUS_META[o.status]||STATUS_META.CREATED;
  const shop = DB.shops[DB.shopId];
  const addr = DB.addresses[o.customerId].find(a=>a.id===o.addressId);
  let actionArea = '';
  if(S.activeRole==='SELLER'){
    if(o.status==='SEARCHING_COURIER'){
      actionArea = `<div class="card" style="text-align:center;"><div class="pulse-dot" style="margin:0 auto 8px;"></div><div class="faint" style="font-size:13px;">Ищем свободного курьера…</div></div>`;
    } else if(o.status==='COURIER_ARRIVED_PICKUP'){
      actionArea = `<div class="field"><label>Код от курьера</label><input id="pickupcode" maxlength="4" placeholder="0000"></div>
        <button class="btn btn-primary" onclick="confirmPickupCode(DB.orders['${o.id}'], document.getElementById('pickupcode').value)">Подтвердить передачу</button>`;
    } else if(o.status==='EXPIRED'){
      actionArea = `<div class="empty"><div class="em">⏱</div>Свободных курьеров не нашлось</div>`;
    }
    if(['CREATED','SEARCHING_COURIER','COURIER_ASSIGNED'].includes(o.status)){
      actionArea += `<button class="btn btn-outline" onclick="cancelOrder(DB.orders['${o.id}'],'SELLER')">Отменить заказ</button>`;
    }
  }
  return `<h3 style="margin:0 0 4px;font-size:18px;">${o.publicId}</h3>
    <span class="chip ${meta.cls}" style="margin-bottom:14px;display:inline-flex;">${meta.icon} ${meta.label}</span>
    <div class="card stack-sm">
      <div class="kv"><span class="k">🏪 Откуда</span><span>${esc(shop.name)}</span></div>
      <div class="kv"><span class="k">📦 Товар</span><span>${esc(o.items[0].name)} ×${o.items[0].qty}</span></div>
      <div class="kv"><span class="k">🏠 Куда</span><span>${esc(addr.label)}</span></div>
      ${o.courierId? `<div class="kv"><span class="k">🛵 Курьер</span><span>${esc(DB.users[o.courierId].name)}</span></div>`:''}
      <div class="kv"><span class="k">💵 Сумма</span><span>${o.total} ₽</span></div>
    </div>
    <div style="margin-top:14px;" class="stack-sm">${actionArea}</div>
    ${o.courierId? `<button class="btn btn-ghost" style="margin-top:10px;" onclick="openChat('${o.id}')">💬 Чат по заказу</button>`:''}
  `;
}

function openChat(orderId){ S.currentOrderId=orderId; S.sheet='chat'; render(); }
function chatHTML(){
  const o = DB.orders[S.currentOrderId];
  const msgs = DB.messages[o.id] || [];
  return `<h3 style="margin:0 0 4px;font-size:17px;">Чат · ${o.publicId}</h3>
  <p class="faint" style="font-size:12px;margin:0 0 14px;">Продавец, курьер и покупатель — в одном чате</p>
  <div style="max-height:280px;overflow-y:auto;margin-bottom:12px;">
    ${msgs.length? msgs.map(m=> m.sys? `<div class="msg sys">${esc(m.text)}</div>` : `<div class="msg ${m.role===S.activeRole?'me':'them'}"><div style="font-size:10.5px;opacity:.7;margin-bottom:2px;">${roleLabel(m.role)}</div>${esc(m.text)}</div>`).join('') : `<div class="empty" style="padding:20px;"><div class="em">💬</div>Сообщений пока нет</div>`}
  </div>
  <div class="row">
    <input id="chatInput" placeholder="Сообщение..." style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:12px 16px;color:var(--text);">
    <button class="btn btn-primary btn-sm" style="flex:0 0 auto;" onclick="sendChat('${o.id}')">➤</button>
  </div>`;
}
function sendChat(orderId){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  DB.messages[orderId] = DB.messages[orderId] || [];
  DB.messages[orderId].push({id:uid(), role:S.activeRole, text, time:nowStr()});
  render();
  setTimeout(()=>{ const el=document.getElementById('chatInput'); if(el) el.focus(); },0);
}

function ratingHTML(){
  const o = DB.orders[S.currentOrderId];
  const d = S.ratingDraft;
  return `<h3 style="margin:0 0 4px;font-size:17px;">Как прошла доставка?</h3>
  <p class="faint" style="font-size:12.5px;margin:0 0 18px;">Заказ ${o.publicId}</p>
  <div style="text-align:center;font-size:32px;letter-spacing:6px;margin-bottom:16px;">
    ${[1,2,3,4,5].map(n=>`<span style="cursor:pointer;opacity:${n<=d.stars?1:.25};" onclick="S.ratingDraft.stars=${n};render()">⭐</span>`).join('')}
  </div>
  <div class="field"><label>Комментарий</label><textarea id="rate-comment" placeholder="Необязательно">${esc(d.comment)}</textarea></div>
  <button class="btn btn-primary" onclick="S.ratingDraft.comment=document.getElementById('rate-comment').value; submitRating(DB.orders['${o.id}'])">Отправить оценку</button>`;
}

/* ---------------- helpers/binding ---------------- */
function bind(){
  document.querySelectorAll('.otpd').forEach((inp,idx,arr)=>{
    inp.addEventListener('input', e=>{
      if(e.target.value && idx<arr.length-1) arr[idx+1].focus();
    });
  });
}

render();
</script>
</body>
</html>
